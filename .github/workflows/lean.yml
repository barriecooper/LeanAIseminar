name: Lean build

# Run checks on PRs, not again after merging to main.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Lean, fetch Mathlib cache, and build
        run: bash .devcontainer/setup.sh
      - name: Check the tutorial (student placeholders emit warnings)
        run: '"${ELAN_HOME:-$HOME/.elan}/bin/lake" env lean Workshop/Tutorial.lean'
      - name: Check that setup preserved dependency pins
        run: git diff --exit-code -- lean-toolchain lakefile.toml lake-manifest.json
